version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: aaud-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aaud-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
