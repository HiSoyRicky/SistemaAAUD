<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sistema AAUD en actualización</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 1.5rem; background: #f9fafb; color: #1f2937; font: 1rem/1.55 system-ui, sans-serif; }
    main { width: min(100%, 34rem); text-align: center; }
    img { display: block; width: min(10rem, 60%); height: auto; margin: 0 auto 1.5rem; object-fit: contain; }
    h1 { margin: 0 0 1rem; font-size: clamp(1.5rem, 4vw, 1.875rem); line-height: 1.2; }
    p { color: #4b5563; margin: 0 0 1rem; }
    button { display: inline-block; border: 0; border-radius: .5rem; padding: .75rem 1.5rem; background: #2563eb; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button:focus-visible { outline: 3px solid #1e40af; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/_aaud-maintenance/logo-aaud.png" alt="Logo de la Autoridad de Aseo Urbano y Domiciliario">
    <h1>Sistema temporalmente no disponible</h1>
    <p>Estamos actualizando el Sistema Institucional AAUD. El servicio estará disponible nuevamente en unos minutos.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
