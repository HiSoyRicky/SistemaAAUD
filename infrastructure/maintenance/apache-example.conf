# EJEMPLO para el VirtualHost de system.aaud.local; no es configuración activa.
# Mantener ProxyPass /api/ y /socket.io/ existentes y validar el orden de reglas.
# Requiere mod_alias, mod_rewrite y mod_headers.
Alias /_aaud-maintenance/ /var/www/aaud-maintenance/
<Directory /var/www/aaud-maintenance>
    Require all granted
    Options -Indexes
</Directory>

ErrorDocument 503 /_aaud-maintenance/index.html
<LocationMatch "^/(api|socket\.io|uploads|fotos_personal)(/|$)">
    ErrorDocument 503 default
</LocationMatch>
RewriteEngine On
# El indicador vive fuera del checkout y de los archivos publicados.
# Mostrar solo navegación HTML; no interceptar API, WebSocket, archivos ni escrituras.
RewriteCond /var/lib/aaud-deploy/maintenance.flag -f
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteCond %{HTTP:Accept} text/html [NC]
RewriteCond %{REQUEST_URI} !^/(api(?:/|$)|socket\.io(?:/|$)|uploads(?:/|$)|fotos_personal(?:/|$)|_aaud-maintenance/)
RewriteRule ^ - [R=503,L]

# Si un recurso generado no existe, no devolver index.html como si fuera JavaScript.
# Esta regla debe ejecutarse antes de la reescritura SPA del <Directory> existente.
RewriteCond %{REQUEST_URI} ^/assets/
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
RewriteRule ^ - [R=404,L]

Header always set Retry-After "60" "expr=%{REQUEST_STATUS} == 503 && %{REQUEST_URI} !~ m#^/(api|socket\.io|uploads|fotos_personal)(/|$)#"
Header always set Cache-Control "no-store" "expr=%{REQUEST_STATUS} == 503 && %{REQUEST_URI} !~ m#^/(api|socket\.io|uploads|fotos_personal)(/|$)#"
