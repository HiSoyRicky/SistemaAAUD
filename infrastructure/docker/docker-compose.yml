services:
  backend:
    build:
      context: ../..          # raíz del monorepo
      dockerfile: apps/backend/Dockerfile
    container_name: aaud-backend
    env_file:
      - ../../.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"  # Solo accesible desde el host, no expuesto al mundo
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Para conectar a PostgreSQL del host
    networks:
      - aaud-net

  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
    container_name: aaud-frontend
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"   # Solo accesible desde el host
    networks:
      - aaud-net

networks:
  aaud-net:
    driver: bridge